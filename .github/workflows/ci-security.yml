name: CI Security Gates

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint -- --quiet
      - run: pnpm run build
      - run: pnpm exec tsc --noEmit
      - run: pnpm run test:contracts
      - run: pnpm run test:call-effects
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:call-effects:browser
      - run: pnpm run test:e2e

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simple secret patterns
        run: |
          ! rg -n "(AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24,}|xox[baprs]-[0-9a-zA-Z-]{10,}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----)" .
